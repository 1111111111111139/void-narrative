<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Narrative · 留白</title>
    <style>
        /* CSS 变量 - 浅色主题（默认） */
        :root {
            /* 新版变量 */
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --border: #e9e9ef;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #2b7de9;
            --accent-hover: #1a5cb0;
            --hover-bg: #f0f0f2;
            --user-bubble: #e3f2fd;
            --ai-bubble: #ffffff;
            --narrator-bg: #eef2f6;
            --description: #888;
            --danger: #ff3b30;
            --danger-bg: #fff5f5;
            --thought-bg: #f0f0f0;
            --red: #ff4d4f;
            --blue: #2b7de9;
            --green: #07c160;
            
            /* 旧版兼容别名 */
            --card: var(--card-bg);
            --glass-bg: var(--card-bg);
            --glass-border: var(--border);
        }
        
        /* 深色主题 */
        body.dark {
            --bg: #0d0d0f;
            --card-bg: #1c1c1e;
            --border: #2c2c2e;
            --text-primary: #e8e8ed;
            --text-secondary: #8e8e93;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --hover-bg: #2c2c2e;
            --user-bubble: #1c3a5c;
            --ai-bubble: #2c2c2e;
            --narrator-bg: #2c2c2e;
            --description: #aaa;
            --thought-bg: #2c2c2e;
            
            /* 旧版兼容别名 */
            --card: var(--card-bg);
            --glass-bg: var(--card-bg);
            --glass-border: var(--border);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, "Noto Sans SC", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
        }
        
        /* 头部 */
        .header {
            height: 60px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 0.5px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }
        .header b { font-size: 18px; font-weight: 600; }
        
        .view { flex: 1; display: none; overflow-y: auto; padding-bottom: 20px; }
        .view.active { display: block; }
        
        /* 卡片 */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            margin: 12px;
            padding: 16px;
            border: 0.5px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        
        .row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--border);
        }
        
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--hover-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 聊天区域 */
        #chat-flow {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .msg-row {
            display: flex;
            width: 100%;
            gap: 10px;
            position: relative;
        }
       .msg-row.user { flex-direction: row-reverse !important; }
        
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
        }
        .msg-row.ai .bubble {
            background: var(--ai-bubble);
            border-top-left-radius: 4px;
            border: 0.5px solid var(--border);
        }
        .msg-row.user .bubble {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
        }
        
        .narrator {
            align-self: center;
            background: var(--narrator-bg);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 30px;
            margin: 4px 0;
            text-align: center;
        }
        
        .thought-btn {
            position: absolute;
            left: 56px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .msg-row.user .thought-btn { left: auto; right: 56px; }
        
        .thought-bubble {
            background: var(--thought-bg);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 4px;
            margin-left: 56px;
            max-width: 70%;
            font-style: italic;
            display: none;
        }
        .thought-bubble.show { display: block; }
        
        /* 底部导航 */
        #nav {
            height: 70px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
        }
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            width: 25%;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn.active { color: var(--accent); font-weight: 500; }
        .nav-btn b { font-size: 22px; margin-bottom: 2px; font-weight: 400; }
        
        /* 全屏层 */
        .full-layer {
            position: fixed;
            inset: 0;
            background: var(--card-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        .layer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        label {
            display: block;
            margin-top: 15px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 0.5px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text-primary);
        }
        
        .btn {
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-weight: 500;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            background: var(--hover-bg);
            color: var(--text-primary);
            transition: 0.2s;
        }
        .btn-blue { background: var(--accent); color: #fff; }
        .btn-gray { background: var(--hover-bg); color: var(--text-primary); }
        
        .tab-item {
            padding: 6px 18px;
            background: var(--hover-bg);
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
            color: var(--text-secondary);
        }
        .tab-item.active { background: var(--accent); color: #fff; }
        
        /* 状态面板 - 修复小屏遮挡问题 */
        #state-panel {
            position: fixed;
            top: 70px;
            right: 12px;
            left: auto;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 12px;
            z-index: 100;
            border: 0.5px solid var(--border);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: calc(100% - 24px);
            white-space: nowrap;
            overflow-x: auto;
        }
        
        /* 小屏适配：状态面板自动换行 */
        @media (max-width: 480px) {
            #state-panel {
                white-space: normal;
                top: 60px;
                right: 8px;
                left: 8px;
                width: auto;
                font-size: 10px;
                padding: 6px 12px;
            }
            #state-panel > div {
                flex-wrap: wrap;
                gap: 6px;
            }
            .thought-btn { left: 46px; }
            .msg-row.user .thought-btn { right: 46px; }
            .bubble { max-width: 85%; font-size: 14px; }
        }
        
        .star-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .star-btn.active { color: #ffb340; }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .tag {
            background: var(--hover-bg);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }
        
.tab-item {
    padding: 7px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-secondary);
    transition: all 0.15s;
}
.tab-item.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab-item:hover:not(.active) { background: var(--hover-bg); }

          /* 记忆区域 - 新版左侧导航卡片式 */
#memory-tabs .tab-item {
    cursor: pointer;
}
#memory-tabs .tab-item.active {
    background: var(--accent);
    color: white;
}
#memory-content {
    min-height: 200px;
}
.memory-card {
    background: var(--hover-bg);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    border: 0.5px solid var(--border);
}
.memory-card:hover {
    transform: translateX(2px);
}
.memory-footer {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 8px;
    flex-wrap: wrap;
}     

        /* 开关样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #c6c6c8;
            transition: 0.25s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.25s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

.memory-nav-item {
    padding: 10px 6px;
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s;
    background: transparent;
    border: none;
}
.memory-nav-item:hover { background: var(--accent-light); color: var(--text-primary); }
.memory-nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }

/* 手机小屏适配 */
@media (max-width: 480px) {
    .memory-nav-item {
        padding: 8px 4px;
        font-size: 11px;
    }
    #memory-nav {
        width: 70px !important;
    }

    #chat-in {
        font-size: 14px;
        padding: 8px 12px;
    }
    #layer-chat .header {
        padding: 6px 10px;
    }
    #scene-info-bar {
        font-size: 9px;
        gap: 8px;
    }
    #char-status-bar {
        font-size: 9px;
        gap: 8px;
    }
}
/* 角色卡编辑器样式 */
.form-group { margin-bottom: 20px; }
.form-label { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; display: block; }
.form-label small { font-weight: 400; color: var(--text-secondary); font-size: 12px; }
.collapse-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.collapse-title { font-size: 14px; font-weight: 500; }
.collapse-icon { font-size: 12px; color: var(--text-secondary); }
.setting-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.switch-group { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.switch-label { font-size: 14px; color: var(--text-primary); }
.switch-label small { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 2px; }
.slider-container { display: flex; align-items: center; gap: 12px; }
.slider-container input { flex: 1; padding: 0; height: 4px; -webkit-appearance: none; background: var(--border); border-radius: 4px; }
.slider-container input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; }
.slider-value { width: 45px; text-align: center; font-size: 14px; font-weight: 500; color: var(--accent); }
.slider-range { font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; margin-top: 4px; }

/* ==================== 心声弹窗样式 ==================== */
.thought-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    z-index: 2000;
    display: none;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.thought-dialog {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 16px 12px;
    width: 280px;
    max-width: 85vw;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    animation: scaleIn 0.2s ease;
}
@keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.thought-dialog .char-name {
    font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;
}

.thought-dialog .thought-text {
    font-size: 14px; line-height: 1.6; color: var(--text-primary);
    background: var(--bg); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
    flex: 1; overflow-y: auto; max-height: 50vh;
}

.thought-dialog .thought-actions {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px;
}

.icon-btn {
    background: none; border: none; cursor: pointer; padding: 2px;
    display: flex; align-items: center; justify-content: center;
}
.icon-btn svg {
    width: 18px; height: 18px;
    stroke: var(--text-primary); stroke-width: 1.6;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.icon-btn.fav svg { fill: none; }
.icon-btn.fav.active svg { fill: var(--text-primary); }

/* ==================== 系统消息样式 ==================== */
.system-msg {
    align-self: center;
    max-width: 85%;
    margin: 8px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.system-msg .system-bubble {
    background: linear-gradient(135deg, rgba(100,100,100,0.06), rgba(100,100,100,0.03));
    border: 0.5px dashed var(--border);
    border-radius: 16px;
    padding: 10px 18px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-secondary);
    text-align: center;
    max-width: 100%;
}

.system-msg .system-prefix {
    font-size: 10px;
    color: var(--text-secondary);
    opacity: 0.6;
    letter-spacing: 1px;
    margin-bottom: 2px;
}

/* 系统对话模式（用户与系统对话时的特殊样式） */
.system-dialog-mode .msg-row.user .bubble {
    background: rgba(227, 242, 253, 0.5);
    border: 0.5px dashed var(--border);
    opacity: 0.85;
}

.system-dialog-mode .msg-row.user .bubble::before {
    content: "📡 ";
    font-size: 10px;
    opacity: 0.6;
}

body.dark .system-msg .system-bubble {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
    color: #aaa;
}
body.dark .narrator-msg {
    color: #888;
}
body.dark #scene-info-bar {
    background: rgba(255,255,255,0.03);
}
body.dark .char-status-dot.available { background: #4caf84; }
body.dark .char-status-dot.busy { background: #f5b842; }
body.dark .char-status-dot.away { background: #e05555; }

/* ==================== 全屏角色详情面板 ==================== */
.detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    z-index: 2000;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.detail-panel.open {
    transform: translateX(0);
}
.panel-header {
    padding: 16px 20px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: inherit;
}
.panel-header .back-btn {
    font-size: 24px;
    cursor: pointer;
    color: var(--text-primary);
}
.panel-header h3 {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
}
.panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}
.profile-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
}
.profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--hover-bg);
    margin-bottom: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.profile-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
}
.profile-bio {
    font-size: 13px;

    margin-top: 4px;
}
.info-card {
    background: var(--hover-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
}
.info-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-primary);
}
.info-row {
    margin-bottom: 8px;
    font-size: 14px;

    color: var(--text-primary);
}
.info-label {
    color: var(--text-secondary);
    width: 60px;
    display: inline-block;
}
.stats-row {
    display: flex;

    padding: 12px 0;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 16px;
}
.stat-item {
    text-align: center;
}
.stat-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
}
.stat-label {
    font-size: 11px;

}
.record-item {
    display: flex;

}
.record-time {
    font-size: 12px;
    color: var(--text-secondary);

}
.record-event {
    flex: 1;
    font-size: 13px;

}
.record-change {
    font-size: 13px;

}
.record-change.positive { color: #07c160; }

.expand-btn {

    padding: 10px;
    color: var(--accent);

}
.diary-card {
    background: var(--hover-bg);
    border-radius: 16px;

    margin: 16px 0;
}
.diary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--text-secondary);
}
.diary-content {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    margin-bottom: 12px;
    white-space: pre-wrap;
    word-break: break-word;
}
.diary-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
}
.diary-actions button {
    background: none;

    font-size: 13px;
    color: var(--accent);

}
.diary-empty {

}
.interact-row {
    display: flex;
    justify-content: space-between;

}
.disabled-hint {
    text-align: center;
    padding: 20px;
    color: var(--text-secondary);
    font-size: 13px;
}
.history-diary-item {
    padding: 12px;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
}
.history-diary-item:hover {
    background: var(--hover-bg);
}
.history-diary-date {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
}
.history-diary-preview {
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ==================== 系统消息样式 ==================== */
.system-msg {
    align-self: center;
    max-width: 85%;

<script>
// ============= 主题迁移与初始化 ==============
function migrateTheme() {
    let theme = localStorage.getItem('theme');
    const oldTheme = localStorage.getItem('EVE_THEME');
    const oldDarkMode = localStorage.getItem('darkMode');
    
    if (!theme && oldTheme) {
        theme = oldTheme;
        localStorage.setItem('theme', oldTheme);
        localStorage.removeItem('EVE_THEME');
    }
    if (!theme && oldDarkMode) {
        theme = oldDarkMode === 'true' ? 'dark' : 'light';
        localStorage.setItem('theme', theme);
        localStorage.removeItem('darkMode');
    }
    if (!theme) {
        theme = 'light';
        localStorage.setItem('theme', 'light');
    }
    return theme;
}

const savedTheme = migrateTheme();
if (savedTheme === 'dark') document.body.classList.add('dark');
const themeToggle = document.getElementById('theme-toggle');
if (themeToggle) themeToggle.checked = savedTheme === 'dark';

// ==================== 系统设置折叠 ====================
function toggleSystemConfig() {
    const content = document.getElementById('system-config-content');
    const icon = document.getElementById('system-config-icon');
    if (content.style.display === 'none') {
        content.style.display = 'block';
        icon.innerHTML = '▼';
    } else {
        content.style.display = 'none';
        icon.innerHTML = '▶';
    }
}

function toggleSystemAdvanced() {
    const content = document.getElementById('system-advanced-content');
    const icon = document.getElementById('system-advanced-icon');
    if (content.style.display === 'none') {
        content.style.display = 'block';
        icon.innerHTML = '▼';
    } else {
        content.style.display = 'none';
        icon.innerHTML = '▶';
    }
}

// 切换任务链配置折叠

// 收集任务链数据
function collectQuestChain() {
    const name = document.getElementById('quest-chain-name')?.value || '好感度主线';
    const container = document.getElementById('quest-steps-container');
    if (!container) return [];
    
    const stepDivs = container.querySelectorAll('.quest-step');
    const steps = [];
    stepDivs.forEach((div, i) => {
        const targetInput = div.querySelector('.quest-target');
        const rewardInput = div.querySelector('.quest-reward');
        if (targetInput && rewardInput) {
            steps.push({
                id: `step_${Date.now()}_${i}`,
                order: i + 1,
                name: `好感度达到 ${targetInput.value}`,
                targetAffection: parseInt(targetInput.value) || 0,
                reward: rewardInput.value || ''
            });
        }
    });
    
    // 按目标值排序确保递增
    steps.sort((a, b) => a.targetAffection - b.targetAffection);
    steps.forEach((s, i) => s.order = i + 1);
    
    return { name, steps };
}

// 添加任务步骤
function addQuestStep(targetValue = '', rewardValue = '') {
    const container = document.getElementById('quest-steps-container');
    if (!container) return;
    
    const stepCount = container.querySelectorAll('.quest-step').length;
    const stepNum = stepCount + 1;
    
    // 自动计算最低目标值
    let minTarget = 0;
    if (stepCount > 0) {
        const allTargets = container.querySelectorAll('.quest-target');
        allTargets.forEach(input => {
            const val = parseInt(input.value) || 0;
            if (val > minTarget) minTarget = val;
        });
        minTarget += 5; // 默认比上一步高5
    }
    if (targetValue === '') targetValue = minTarget;
    
    const stepDiv = document.createElement('div');
    stepDiv.className = 'quest-step';
    stepDiv.style.cssText = 'background:var(--hover-bg); border-radius:12px; padding:12px; margin-bottom:8px;';
    stepDiv.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:13px; font-weight:500;">步骤 ${stepNum}</span>
            <button onclick="this.closest('.quest-step').remove()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px;">✕</button>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <span style="font-size:12px; white-space:nowrap;">好感度 ≥</span>
            <input type="number" class="quest-target" value="${targetValue}" min="0" max="100" style="width:70px; padding:6px 8px; text-align:center;">
            <span style="font-size:12px; white-space:nowrap;">奖励：</span>
            <input type="text" class="quest-reward" value="${escapeHtml(rewardValue)}" placeholder="如：解锁特殊对话" style="flex:1; padding:6px 8px;">
        </div>
    `;
    container.appendChild(stepDiv);
}

function renderQuestSteps() {

        });
    }
}

    getStyleConfig(plot) {
        const globalLore = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
        const systemConfig = globalLore?.systemConfig || {};
        const preset = SystemStylePresets[systemConfig.stylePreset] || SystemStylePresets.humorous;

            name: systemConfig.name || "小D",
            talkFrequency: systemConfig.talkFrequency || preset.defaultTalkFrequency || 3,

            stylePreset: systemConfig.stylePreset || "humorous"

    // 判断系统是否应该说话
    shouldSpeak(eventType, styleConfig) {
        const freq = styleConfig.talkFrequency;
        
        // 高频事件（总是说话）
        const highPriority = ["quest_complete", "affection_tier_change", "error_warning"];
        if (highPriority.includes(eventType)) return true;
        
        // 中频事件（根据话唠程度决定）
        const midPriority = ["affection_change", "user_call", "new_quest"];
        if (midPriority.includes(eventType)) {
            return Math.random() * 10 < freq + 2;
        }
        
        // 低频事件
        const lowPriority = ["idle_reminder", "encouragement"];
        if (lowPriority.includes(eventType)) {
            return Math.random() * 10 < freq - 2;
        }
        
        return false;
    },
    
    // 生成系统消息内容
    generateMessage(eventType, params, styleConfig) {
        const name = styleConfig.name;
        const tone = styleConfig.tonePrompt;
        
        let messages = [];
        
        switch (eventType) {
            case "affection_change":
                const delta = params.delta || 0;
                const current = params.current || 0;
                const tier = params.tier || "普通";
                if (delta > 0) {
                    messages = [
                        `好感度 +${delta}。当前 ${current}（${tier}）`,

async function fetchWithTimeout(url, options, timeout = 10000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timeoutId);
        return response;
    } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') throw new Error('请求超时');
        throw error;
    }
}

const EnvironmentModule = {
    getTimeContext() {
        const now = new Date();
        const hours = now.getHours();
        let timeOfDay = "白天", moodHint = "";
        if (hours >= 23 || hours <= 5) { timeOfDay = "深夜"; moodHint = "深夜时分，语气可以更慵懒、感性或安静"; }
        else if (hours >= 6 && hours <= 9) { timeOfDay = "清晨"; moodHint = "清晨时分，语气可以更清新、有朝气"; }

const ProactivityModule = {
    timers: new Map(),
    
    start(plotIdx) {
        this.stop(plotIdx);
        const plot = DB.plots[plotIdx];
        if (!plot) return;
        
        const charCard = DB.lores.find(l => l.id === plot.charIds?.[0] && l.type === 'char');
        if (!charCard || !charCard.proactivityEnabled) return;
        
        const intervalHours = charCard.proactivityInterval || 2;
        const intervalMs = intervalHours * 60 * 60 * 1000;
        
        const timer = setInterval(async () => {
            const chatLayer = document.getElementById('layer-chat');
            if (!chatLayer || chatLayer.style.display !== 'flex') return;
            if (engine.curPlotIdx !== plotIdx) return;
            
            const lastMsg = plot.chats[plot.chats.length - 1];
            if (lastMsg && lastMsg.role === 'user') {
                const timeSinceLastUser = Date.now() - (lastMsg.timestamp || 0);
                if (timeSinceLastUser < intervalMs * 0.8) return;
            }
            
            const lastProactive = plot.lastProactiveTime || 0;
            if (Date.now() - lastProactive < intervalMs * 0.5) return;
            
            await this.generateProactiveMessage(plot, charCard);
            plot.lastProactiveTime = Date.now();

        }, Math.min(intervalMs, 60000));

            this.timers.delete(plotIdx);

async function syncStateFromAI(plot) {
    const url = DB.config.stateUrl || DB.config.url;
    const key = DB.config.stateKey || DB.config.key;
    if (!url || !key) { alert("请先配置状态API"); return; }
    const recent = (plot.chats || []).slice(-6).map(m => `${m.role}: ${m.content}`).join('\n');
    const prompt = `根据对话分析状态，返回JSON：{"affectionDelta":整数(-5到5),"emotion":"${EMOTION_OPTIONS.join('/')}","location":"简短位置"}`;
    try {
        const res = await fetchWithTimeout(url + "/chat/completions", { method: 'POST', headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: DB.config.model, messages: [{ role: "user", content: recent + "\n" + prompt }], temperature: 0.3, max_tokens: 150 }) }, 10000);
        const data = await res.json();
        const aiMsg = data.choices?.[0]?.message?.content || "";
        let parsed = {};
        try { parsed = JSON.parse(aiMsg); } catch(e) { const match = aiMsg.match(/\{[\s\S]*\}/); if(match) parsed = JSON.parse(match[0]); }
        const old = plot.state || { affection: 50, emotion: "平静", location: "未知" };
        plot.state = { affection: Math.min(100, Math.max(0, old.affection + (parsed.affectionDelta || 0))), emotion: EMOTION_OPTIONS.includes(parsed.emotion) ? parsed.emotion : old.emotion, location: parsed.location || old.location };

         // 同步到世界系统
        if (!plot.worldState) plot.worldState = {};
        plot.worldState.affection = plot.state.affection;
        
        // 检查任务进度
        if (typeof QuestPanel !== 'undefined') {
            setTimeout(() => QuestPanel.refresh(), 300);
        }
       sys.save();
        renderStatePanel(plot);
        alert("状态已同步");
    } catch(e) { alert("同步失败：" + e.message); }
}

const MemoryEngine = {
    // 获取角色卡
    getCharCard(charId) {
        return DB.lores.find(l => l.id == charId && l.type === 'char');
    },
    
    // 初始化角色记忆结构
    initMemories(charCard) {
        if (!charCard.memories) {
            charCard.memories = { core: [], rawChats: [] };
        }
        if (!charCard.memorySettings) {
            charCard.memorySettings = {
                autoExtract: false,
                extractInterval: 30,
                coreThreshold: 0.9
            };
        }
        if (charCard.extractCounter === undefined) {
            charCard.extractCounter = 0;
        }
    },
    
    // 记录对话（每次对话后调用）
    recordChat(charId, role, content) {
        const charCard = this.getCharCard(charId);
        if (!charCard) return;
        this.initMemories(charCard);
        
        charCard.memories.rawChats.push({
            role,
            content,
            timestamp: Date.now()
        });
        
        // 只保留最近 200 条原始对话
        if (charCard.memories.rawChats.length > 200) {
            charCard.memories.rawChats = charCard.memories.rawChats.slice(-200);
        }
        
        // 自动提取检查
        const settings = charCard.memorySettings;
        if (settings.autoExtract) {
            charCard.extractCounter = (charCard.extractCounter || 0) + 1;
            if (charCard.extractCounter >= settings.extractInterval) {
                charCard.extractCounter = 0;
                this.autoExtract(charId);
            }
        }
        
        sys.save();
    },
    
    // 自动提取（静默）
    async autoExtract(charId) {
        const charCard = this.getCharCard(charId);
        if (!charCard) return;
        
        const rawChats = charCard.memories.rawChats || [];
        if (rawChats.length < 10) return;
        
        try {
            await this.performExtraction(charId, true);
        } catch(e) {
            console.warn('自动记忆提取失败', e);
        }
    },
    
    // 手动提取
    async manualExtract(charId) {
        const charCard = this.getCharCard(charId);
        if (!charCard) {
            alert('角色不存在');
            return;
        }
        
        const rawChats = charCard.memories?.rawChats || [];
        if (rawChats.length < 5) {
            alert('对话不足，至少需要5条对话才能提取记忆');
            return;
        }
        
        try {
            await this.performExtraction(charId, false);
            alert('记忆提取完成');
            if (typeof sys !== 'undefined') sys.renderMemories();
        } catch(e) {
            alert('提取失败：' + e.message);
        }
    },
    
    // 执行提取
    async performExtraction(charId, silent = false) {
        const charCard = this.getCharCard(charId);
        if (!charCard) return;
        this.initMemories(charCard);
        
        const settings = charCard.memorySettings;
        const rawChats = charCard.memories.rawChats || [];
        if (rawChats.length === 0) return;
        
        const recentChats = rawChats.slice(-50).map(c => 
            `${c.role === 'user' ? '用户' : charCard.title}：${c.content}`
        ).join('\n');
        
        const prompt = `你正在分析角色「${charCard.title}」的对话记录。请提取重要记忆。

【角色设定】
${charCard.content?.slice(0, 500) || '无额外设定'}

【对话记录】
${recentChats}

【要求】
1. 提取3-8条重要记忆，每条10-40字
2. 为每条记忆评估重要性（0-1的小数）
3. 输出JSON格式：[{"content":"记忆内容","importance":0.85}]

只输出JSON数组，不要其他内容。`;

        const url = DB.config.memUrl || DB.config.url;
        const key = DB.config.memKey || DB.config.key;
        if (!url || !key) throw new Error('未配置API');
        
        const res = await fetchWithTimeout(url + "/chat/completions", {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: DB.config.model,
                messages: [{ role: "user", content: prompt }],
                temperature: 0.3,
                max_tokens: 800
            })
        }, 20000);
        
        const data = await res.json();
        const aiResponse = data.choices?.[0]?.message?.content || "[]";
        
        let memories = [];
        try {
            memories = JSON.parse(aiResponse);
        } catch(e) {
            const match = aiResponse.match(/\[[\s\S]*\]/);
            if (match) memories = JSON.parse(match[0]);
        }
        
        if (!Array.isArray(memories)) memories = [];
        
        // 分类存储
        const coreThreshold = settings.coreThreshold;
        
        memories.forEach(m => {
            const memory = {
                id: Date.now() + Math.random(),
                content: m.content,
                importance: m.importance,
                timestamp: Date.now()
            };

            
            if (m.importance >= coreThreshold) {
                charCard.memories.core.unshift(memory);
                if (charCard.memories.core.length > 50) charCard.memories.core.pop();
            }
        });
        
        // 清空已提取的原始对话（保留最近5条作为上下文）
        charCard.memories.rawChats = charCard.memories.rawChats.slice(-5);
        sys.save();
    },
    
    // 诊断
    diagnose(charId) {
        const charCard = this.getCharCard(charId);
        if (!charCard) return;
        this.initMemories(charCard);
        
        const m = charCard.memories;
        const info = `
角色：${charCard.title}
核心记忆：${m.core.length} 条
待提取对话：${m.rawChats.length} 条
提取计数：${charCard.extractCounter || 0} / ${charCard.memorySettings?.extractInterval || 30}
        `.trim();
        
        alert(info);
    },
    
    // 获取记忆用于上下文
    getMemoriesForContext(charId, limit = 5) {
        const charCard = this.getCharCard(charId);
        if (!charCard?.memories) return [];
        
        const core = (charCard.memories.core || []).slice(0, limit);
        return core.map(m => `[记忆] ${m.content}`);
    }
};

// ==================== 系统记忆自动记录 ====================
const SystemMemoryRecorder = {
    // 在 AI 回复后调用
    async recordAfterResponse(plot, userMsg, aiResponse) {
        if (!plot?.worldState) return;
        const ws = plot.worldState;
        if (!ws.systemMemory) {
            ws.systemMemory = { self: [], characterObservations: {}, worldEvents: [], userProfile: {} };
        }
        const sm = ws.systemMemory;
        
        // 1. 本地规则：检测情绪关键词
        const emotionKeywords = {
            positive: ['笑', '开心', '高兴', '喜欢', '温暖', '感动', '温柔', '谢谢', '好'],
            negative: ['生气', '烦', '讨厌', '滚', '冷漠', '失望', '难过', '累', '不']
        };
        
        let detectedEmotion = null;
        for (let word of emotionKeywords.positive) {
            if (aiResponse.includes(word)) { detectedEmotion = '积极'; break; }
        }
        if (!detectedEmotion) {
            for (let word of emotionKeywords.negative) {
                if (aiResponse.includes(word)) { detectedEmotion = '消极'; break; }
            }
        }
        
        // 2. 记录角色观察
        if (detectedEmotion) {
            const charCard = DB.lores.find(l => plot.charIds?.includes(l.id) && l.type === 'char');
            const charName = charCard?.title || '角色';
            if (!sm.characterObservations[plot.charIds?.[0]]) {
                sm.characterObservations[plot.charIds?.[0]] = [];
            }
            const observations = sm.characterObservations[plot.charIds?.[0]];
            
            // 避免重复记录（5分钟内同类型不重复）
            const recentObs = observations.slice(-1)[0];
            const isDuplicate = recentObs && 
                recentObs.emotion === detectedEmotion && 
                (Date.now() - recentObs.timestamp < 300000);
            
            if (!isDuplicate) {
                observations.push({
                    content: `${charName}表现出${detectedEmotion}情绪`,
                    emotion: detectedEmotion,
                    timestamp: Date.now(),
                    context: aiResponse.slice(0, 50)
                });
                // 只保留最近 50 条
                if (observations.length > 50) observations.shift();
            }
        }
        
        // 3. 记录用户行为
        const actionMatch = userMsg.match(/[（(](.*?)[）)]/);
        if (actionMatch) {
            if (!sm.userProfile) sm.userProfile = {};
            if (!sm.userProfile.recentActions) sm.userProfile.recentActions = [];
            sm.userProfile.recentActions.push({
                action: actionMatch[1],
                timestamp: Date.now()
            });
            if (sm.userProfile.recentActions.length > 20) sm.userProfile.recentActions.shift();
        }
        
        // 4. 首次对话标记为世界事件
        const totalMessages = plot.chats?.filter(c => c.role === 'user' || c.role === 'assistant').length || 0;
        if (totalMessages <= 3 && !sm.worldEvents?.find(e => e.event === 'first_contact')) {
            if (!sm.worldEvents) sm.worldEvents = [];
            sm.worldEvents.push({
                content: '用户与角色首次接触',
                event: 'first_contact',
                timestamp: Date.now()
            });
        }
        
        // 每积累一定对话量（20条），触发一次深层分析
        if (totalMessages > 0 && totalMessages % 20 === 0) {
            this.deepAnalyze(plot);
        }
        
        sys.save();
    },
    
    // 深层分析（调用 API）
    async deepAnalyze(plot) {
        const ws = plot.worldState;
        if (!ws?.systemMemory) return;
        
        const charCard = DB.lores.find(l => plot.charIds?.includes(l.id) && l.type === 'char');
        const charName = charCard?.title || '角色';
        const recentChats = (plot.chats || []).slice(-15).map(c => 
            `${c.role === 'user' ? '用户' : charName}：${c.content}`
        ).join('\n');
        
        const prompt = `分析以下对话，更新用户画像（100字内）。关注：性格特点、行为模式、潜在偏好。

${recentChats}

输出格式：
用户画像：...`;

        const url = DB.config.url;
        const key = DB.config.key;
        if (!url || !key) return;
        
        try {
            const res = await fetchWithTimeout(url + "/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: DB.config.model,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.5,
                    max_tokens: 150
                })
            }, 15000);
            
            const data = await res.json();
            const analysis = data.choices?.[0]?.message?.content || '';
            
            if (analysis && ws.systemMemory) {
                ws.systemMemory.userProfile = ws.systemMemory.userProfile || {};
                ws.systemMemory.userProfile.analysis = analysis;
                sys.save();
            }
        } catch(e) {
            console.warn('深层分析失败', e);
        }
    }
};

const MemorySystem = {
    async summarize(plotIdx) {
        const plot = DB.plots[plotIdx];
        if (!plot?.chats || plot.chats.length < 6) return;
        const lastIdx = plot.lastSummaryIdx || 0;
        if (plot.chats.length - lastIdx < 8) return;
        const recent = plot.chats.slice(-12).map(m => `${m.role}: ${m.content}`).join('\n');
        const prompt = `总结对话中的关键事件、情感变化、新信息（100字内）：\n${recent}`;
        try {
            const url = DB.config.memUrl || DB.config.url;
            const key = DB.config.memKey || DB.config.key;
            if (!url || !key) return;
            const res = await fetchWithTimeout(url + "/chat/completions", { method: 'POST', headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: DB.config.model, messages: [{ role: "user", content: prompt }], max_tokens: 200, temperature: 0.3 }) }, 10000);
            const data = await res.json();
            let summary = data.choices?.[0]?.message?.content;
            if (summary) {
                plot.summaries = plot.summaries || [];
                plot.summaries.push({ id: Date.now(), content: summary, timestamp: Date.now(), starred: false });
                plot.lastSummaryIdx = plot.chats.length;
                if (summary.includes("愤怒") || summary.includes("感动") || summary.includes("承诺") || summary.includes("恨") || summary.includes("爱")) {
                    plot.coreMemories = plot.coreMemories || [];
                    plot.coreMemories.unshift({ content: summary.slice(0, 100), timestamp: Date.now() });
                    if (plot.coreMemories.length > 10) plot.coreMemories.pop();
                }
                sys.save();
                sys.renderMemories();
            }
        } catch(e) { console.warn("摘要失败", e); }
    },
    retrieve(plot, input) {
        let relevant = [];
        const tokens = input.toLowerCase().split(/[\s,，。？!！]+/).filter(t => t.length > 1);
        const allPool = [...(plot.coreMemories || []).map(m => ({ id: m.id, content: m.content, type: '核心', weight: 2.0 })), ...(plot.summaries || []).map(s => ({ id: s.id, content: s.content, type: '摘要', weight: 1.2, starred: s.starred }))];
        allPool.forEach(item => { let score = 0; tokens.forEach(token => { if (item.content.toLowerCase().includes(token)) score += item.weight; }); if (item.starred) score += 3.0; if (score > 0) relevant.push({ id: item.id, content: item.content, score, type: item.type, starred: item.starred }); });
        return relevant.sort((a, b) => b.score - a.score).slice(0, 3).map(r => `[${r.starred ? '⭐' : ''}${r.type}记忆] ${r.content}`);
    },
    toggleStar(plotIdx, summaryId) { const plot = DB.plots[plotIdx]; if (!plot?.summaries) return; const summary = plot.summaries.find(s => s.id == summaryId); if (summary) { summary.starred = !summary.starred; sys.save(); sys.renderMemories(); } },
    getStarredMemories(plot) { if (!plot?.summaries) return []; return plot.summaries.filter(s => s.starred).map(s => `[⭐永久记忆] ${s.content}`); }
};

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

   const LoreEngine = {

    // 解析角色卡的结构化内容
    parseStructuredContent(content) {
        if (!content) return { persona: '', speakingStyle: '', rules: [], examples: [] };
        
        const result = {
            persona: '',
            speakingStyle: '',
            rules: [],
            examples: []
        };
        
        // 按区块分割
        const sections = content.split(/【(.+?)】/g);
        
        for (let i = 1; i < sections.length; i += 2) {
            const title = sections[i].trim();
            const text = sections[i + 1] ? sections[i + 1].trim() : '';
            
            if (title.includes('性格') || title.includes('背景') || title.includes('人设')) {
                result.persona = text;
            } else if (title.includes('说话') || title.includes('风格') || title.includes('语气')) {
                result.speakingStyle = text;
            } else if (title.includes('规则') || title.includes('行为')) {
                const lines = text.split('\n');
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
                        result.rules.push(trimmed.substring(1).trim());
                    } else if (trimmed && !trimmed.startsWith('（')) {
                        result.rules.push(trimmed);
                    }
                });
            } else if (title.includes('示例') || title.includes('对话')) {
                const lines = text.split('\n');
                let currentUser = '';
                let currentChar = '';
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('用户：') || trimmed.startsWith('User:')) {
                        if (currentUser && currentChar) {
                            result.examples.push({ user: currentUser, character: currentChar });
                        }
                        currentUser = trimmed.replace(/^(用户：|User:)/i, '').trim();
                        currentChar = '';
                    } else if (trimmed.startsWith('角色：') || trimmed.startsWith('Character:')) {
                        currentChar = trimmed.replace(/^(角色：|Character:)/i, '').trim();
                    }
                });
                if (currentUser && currentChar) {
                    result.examples.push({ user: currentUser, character: currentChar });
                }
            }
        }
        
        return result;
    },
    
    buildContext(plot) {
        let ctx = "";
        
        // 1. 世界设定
        const global = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
        if (global) ctx += `【世界设定】\n${global.content}\n\n`;

        // 故事线注入
        const storylines = DB.lores.filter(l => l.type === 'storyline' && l.globalId === plot.globalId);
        if (storylines.length) {
            ctx += `【原故事线（仅供参考，不强制遵循）】\n`;
            storylines.forEach(s => {
                ctx += `◎ ${s.title}\n${s.content}\n---\n`;
            });
            ctx += `根据实际剧情推进情况自行判断是否触发以上节点。用户的行为可以改写原故事线。\n\n`;
        }

        // 剧情节点注入
        const plotNodes = plot.worldState?.plotNodes || [];
        if (plotNodes.length > 0) {
            ctx += `【已发生的剧情节点】\n`;
            plotNodes.slice(-5).forEach(n => {
                ctx += `- [${n.time}] ${n.title}：${n.summary}\n`;
            });
            ctx += `\n`;
        }
        
        // 节点的剧情影响
        if (plotNodes.length > 0) {
            const recentNode = plotNodes[plotNodes.length - 1];
            if (recentNode && recentNode.importance >= 3) {
                ctx += `【当前剧情状态】\n最近发生的重要事件：${recentNode.title}——${recentNode.summary}。请在后续对话中体现这一事件对角色的影响（情绪、态度、行为的变化）。\n\n`;
            }
        }

        // 2. 角色设定（增强版）
        const chars = DB.lores.filter(l => plot.charIds?.includes(l.id) && l.type === 'char');
        if (chars.length) {
            ctx += `【角色设定】\n`;
            chars.forEach(char => {
                const parsed = this.parseStructuredContent(char.content);
                
                // 角色名称
                ctx += `◎ ${char.title}\n`;
                
                // 优先级1：行为规则（最高优先级）
                if (parsed.rules.length > 0) {
                    ctx += `【必须遵守的行为规则 - 最高优先级】\n`;
                    parsed.rules.forEach(rule => ctx += `- ${rule}\n`);
                    ctx += `\n`;
                }
                
                // 优先级2：性格背景
                if (parsed.persona) {
                    ctx += `【性格与背景】\n${parsed.persona}\n\n`;
                } else {
                    // 兼容旧格式
                    ctx += `【角色描述】\n${char.content}\n\n`;
                }
                
                // 优先级3：说话风格
                if (parsed.speakingStyle) {
                    ctx += `【说话风格】\n${parsed.speakingStyle}\n\n`;
                }
                
                // 优先级4：示例对话（用于风格强化）
                if (parsed.examples.length > 0) {
                    ctx += `【对话示例 - 请严格模仿以下风格】\n`;
                    parsed.examples.slice(0, 3).forEach(ex => {
                        ctx += `用户：${ex.user}\n${char.title}：${ex.character}\n`;
                    });
                    ctx += `\n`;
                }
                
                ctx += `---\n`;
            });
            ctx += `\n`;
        }

        // 检查是否接近可改写节点
        if (storylines.length > 0 && plotNodes.length > 0) {
            const lastNode = plotNodes[plotNodes.length - 1];
            for (let s of storylines) {
                if (s.content && lastNode) {
                    const lines = s.content.split('\n');
                    for (let line of lines) {
                        if (line.includes('可改写') || line.includes('如果在')) {
                            const nodeKeywords = lastNode.title + lastNode.summary;
                            const lineKeywords = line.replace(/[：:]/g, '').replace(/可改写节点/g, '').replace(/-/g, '').trim();
                            // 简单关键词匹配：如果最近节点和改写条件有关联
                            const overlap = lineKeywords.split('').filter(c => nodeKeywords.includes(c)).length;
                            if (overlap > lineKeywords.length * 0.3) {
                                SystemMessenger.addSystemMessage(plot, `💡 剧情分支提示：${line.trim()}`);
                                break;
                            }
                        }
                    }
                }
            }
        }
        
        return ctx;
    },
    
    getActiveLocals(plot, input) {
        const locals = DB.lores.filter(l => plot.localIds?.includes(l.id) && l.type === 'local');
        const active = [], lower = input.toLowerCase();
        for (let l of locals) { 
            if (l.keywords?.some(k => lower.includes(k.toLowerCase()))) active.push(l); 
            else if (!l.keywords?.length && l.content.length < 300) active.push(l); 
        }
        return active;
    },
    
    buildDynamicContext(plot, input) {
        const active = this.getActiveLocals(plot, input);
        return active.length ? `【当前情境准则】\n${active.map(l => l.content).join('\n')}\n` : "";
    }
};

const ThoughtEngine = {
    buildPrompt(ctx, input, mask, recentWindow, subtext, envContext, memories, starredMemories, actionContext) {
        return `你是一个真实人类角色。请深度思考后再说话。

${envContext}
${ctx}
${starredMemories.length ? `【⭐永久记忆】\n${starredMemories.join('\n')}\n` : ''}
${memories.length ? `【相关记忆】\n${memories.join('\n')}\n` : ''}
${recentWindow}
${actionContext}
${subtext ? `\n【导演指令（角色不知道）】\n${subtext}\n` : ''}

【用户输入】${input}

请按以下格式输出：
<thought>
现状评估：我现在在哪里？我和用户当前是什么关系？最近的氛围如何？
隐含动机：我内心深处真正想要的是什么？但我嘴上能直接说出来吗？
语气修正：基于当前好感度(${mask?.name || '未知'}对用户的好感)和环境，我应该用（冷淡/温和/热情/试探/慵懒）的哪种腔调？
</thought>
[台词]`;
    },
    parse(res) {
        const thought = res.match(/<thought>([\s\S]*?)<\/thought>/)?.[1]?.trim() || "";
        let speech = res.replace(/<thought>[\s\S]*?<\/thought>/, "").replace(/^\[台词\]\s*/, "").trim();
        if (!speech && !thought) speech = res;
        return { thought, speech };
    },
    parseMulti(res) {
        const bubbles = [];
        const blocks = res.split(/\n(?=【)/);
        
        for (let block of blocks) {
            block = block.trim();
            if (!block) continue;
            
            // 检查是否是旁白
            if (block.startsWith('（') && !block.match(/^【/)) {
                const narratorMatch = block.match(/^[（(]([^）)]*)[）)]/);
                if (narratorMatch) {
                    bubbles.push({ role: 'narrator', content: narratorMatch[0] });
                    continue;
                }
            }
            
            // 检查是否是新格式角色气泡
            const charMatch = block.match(/^【(.+?)】\s*\n?\s*([（(][^）]*[）)])?\s*(.+)/s);
            if (charMatch) {
                const charName = charMatch[1].trim();
                const action = charMatch[2] || '';
                const dialogue = charMatch[3]?.trim() || '';
                const content = action ? `${action} ${dialogue}` : dialogue;
                if (content) {
                    bubbles.push({ role: 'assistant', charName, content });
                }
                continue;
            }
            
            // 检查是否是旧格式（<thought>...</thought>[台词]）
            if (block.includes('<thought>') || block.includes('[台词]')) {
                // 跳过，让旧版 parse 处理
                return [];
            }
            
            // 检查是否是纯旁白
            if (/^[（(]/.test(block)) {
                const narratorMatch = block.match(/^[（(]([^）)]*)[）)]/);
                if (narratorMatch) {
                    bubbles.push({ role: 'narrator', content: narratorMatch[0] });
                }
            }
        }
        
        return bubbles;
    }
};

例如：[QUEST: 让ta愿意和你单独吃饭, 40]

` : ''}
${id !== -1 ? `<button class="btn" style="color:var(--danger); margin-top:20px" onclick="loreOps.del('${lore.id}')">删除此条目</button>` : ''}`;
        ui.openLayer("编辑设定", html, "保存", () => {

                id: lore.id,
                title: document.getElementById('l-title').value,
                type: document.getElementById('l-type').value,
                content: document.getElementById('l-content').value,
                ava: document.getElementById('l-ava').value,
                keywords: document.getElementById('l-keywords').value.split(',').map(k => k.trim()).filter(k => k)
            };

        // 如果是大世界类型，收集系统设置
        if (data.type === 'global') {
            data.systemConfig = {
                enabled: document.getElementById('syscfg-enabled')?.checked !== false,
                name: document.getElementById('syscfg-name')?.value || '小D',
                callCommand: document.getElementById('syscfg-call')?.value || '@小D',
                visibility: document.getElementById('syscfg-visibility')?.value || 'hidden',
                stylePreset: document.getElementById('syscfg-style')?.value || 'humorous',
                customTone: document.getElementById('syscfg-tone')?.value || '',
                customExample: document.getElementById('syscfg-example')?.value || '',
                talkFrequency: parseInt(document.getElementById('syscfg-frequency')?.value) || 3,
                questChains: collectQuestChain() ? [collectQuestChain()] : []
            };
        }

            if (id === -1) DB.lores.push(data);
            else { 
                let idx = DB.lores.findIndex(x => x.id == id); 
                if (idx !== -1) DB.lores[idx] = data; 
            }
            sys.save();
        });
    },
    del(id) { 
        if (confirm('删除？')) { 
            DB.lores = DB.lores.filter(x => x.id != id); 
            sys.save(); 
            ui.closeLayer(); 
        } 
    }
};

function renderCharTags() {
    const container = document.getElementById('char-tags-container');
    if (!container) return;
    container.innerHTML = charCardTags.map((tag, idx) => `<div class="tag" style="display:flex; align-items:center; gap:6px; background:var(--hover-bg); padding:4px 10px; border-radius:20px;"><span>${escapeHtml(tag)}</span><span onclick="removeCharTag(${idx})" style="cursor:pointer; color:var(--text-secondary);">✕</span></div>`).join('');
}

function addCharTag() {
    const input = document.getElementById('char-tag-input');
    const tag = input.value.trim();
    if (tag && !charCardTags.includes(tag)) {
        charCardTags.push(tag);
        renderCharTags();
        input.value = '';
    }
}

function removeCharTag(index) {
    charCardTags.splice(index, 1);
    renderCharTags();
}

function uploadCharAvatar() {

        if (file) {

function updateCoreThresholdDesc(val) {
    const desc = document.getElementById('char-core-threshold-desc');
    if (!desc) return;
    const v = parseFloat(val);
    if (v >= 0.95) desc.innerText = '只保留最重要的转折性事件和承诺';
    else if (v >= 0.85) desc.innerText = '保留关系变化、情绪转折和重要约定';
    else if (v >= 0.75) desc.innerText = '大部分情感波动和事件都会被记住';
    else desc.innerText = '几乎所有互动都会成为核心记忆';
}

// 收集记忆设置

    return {

function getCharCardData() {

    };

function saveCharCard() {
    const data = getCharCardData();

    // 收集自定义雷区设置
    const forbiddenConfig = {
        enabled: document.getElementById('char-forbidden-enabled')?.checked || false,
        words: (document.getElementById('char-forbidden-words')?.value || '').split(',').map(w => w.trim()).filter(w => w),
        patterns: (document.getElementById('char-forbidden-patterns')?.value || '').split('\n').map(p => p.trim()).filter(p => p),
        actions: (document.getElementById('char-forbidden-actions')?.value || '').split(',').map(a => a.trim()).filter(a => a)
    };
    data.forbiddenConfig = forbiddenConfig;

    // 添加记忆系统数据
    const memorySettings = collectMemorySettings();
    data.memorySettings = memorySettings;
    
    // 如果是新建角色，初始化记忆结构
    if (currentCharCardId === -1) {
        data.memories = {
            core: [],
            rawChats: []
        };
        data.extractCounter = 0;
    } else {
        // 保留原有记忆数据
        const oldCard = DB.lores.find(l => l.id === currentCharCardId);
        if (oldCard) {
            data.memories = oldCard.memories || { core: [], rawChats: [] };
            data.extractCounter = oldCard.extractCounter || 0;
        } else {
            data.memories = { core: [], rawChats: [] };
            data.extractCounter = 0;
        }
    }

    // 保留旧的自定义雷区（如果存在）
    if (currentCharCardId !== -1) {
        const oldCard = DB.lores.find(l => l.id === currentCharCardId);
        if (oldCard && oldCard.forbiddenConfig) {
            // 用户没填的字段保留旧值
            if (!data.forbiddenConfig.words.length && oldCard.forbiddenConfig.words.length) {
                data.forbiddenConfig.words = oldCard.forbiddenConfig.words;
            }
            if (!data.forbiddenConfig.patterns.length && oldCard.forbiddenConfig.patterns.length) {
                data.forbiddenConfig.patterns = oldCard.forbiddenConfig.patterns;
            }
            if (!data.forbiddenConfig.actions.length && oldCard.forbiddenConfig.actions.length) {
                data.forbiddenConfig.actions = oldCard.forbiddenConfig.actions;
            }
        }
    } 

    if (!data.title) { alert('请填写角色名称'); return; }
    if (currentCharCardId === -1) {
        DB.lores.push(data);
    } else {
        const idx = DB.lores.findIndex(x => x.id == currentCharCardId);
        if (idx !== -1) DB.lores[idx] = data;
    }
    sys.save();
    ui.closeLayer();
    alert('角色卡已保存');
}

function exportCharCard() {
    const data = getCharCardData();
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], {type: 'application/json'});
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = `角色卡_${data.title || '未命名'}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('导出成功');
}

function importCharCard() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                document.getElementById('char-name').value = data.title || '';
                charCardTags = data.tags || [];
                renderCharTags();
                document.getElementById('char-bio').value = data.bio || '';
                document.getElementById('char-content').value = data.content || '';
                document.getElementById('char-initial-affection').value = data.initialAffection || 0;
                window.charAvatarBase64 = data.avatar || '';
                const preview = document.getElementById('char-avatar-preview');
                if (window.charAvatarBase64) preview.innerHTML = `<img src="${window.charAvatarBase64}" style="width:100%;height:100%;object-fit:cover;">`;
                else preview.innerHTML = '<span style="font-size: 32px; color: var(--text-secondary);">👤</span>';
                document.getElementById('char-enable-affection').checked = data.enableAffection !== false;
                document.getElementById('char-enable-diary').checked = data.enableDiary !== false;
                document.getElementById('char-speed-up').value = data.speedUp || 1.0;
                document.getElementById('char-speed-down').value = data.speedDown || 1.0;
                document.getElementById('char-speed-up-value').innerText = (data.speedUp || 1.0).toFixed(1);
                document.getElementById('char-speed-down-value').innerText = (data.speedDown || 1.0).toFixed(1);
                document.getElementById('char-proactivity-enabled').checked = data.proactivityEnabled !== false;
                document.getElementById('char-proactivity-interval').value = data.proactivityInterval || 2;
                document.getElementById('char-proactivity-interval-value').innerText = (data.proactivityInterval || 2).toFixed(1);
                const proactivitySection = document.getElementById('char-proactivity-section');
                if (proactivitySection) {
                    proactivitySection.style.display = data.proactivityEnabled !== false ? 'block' : 'none';
                }
                alert('导入成功');
            } catch(err) { 
                alert('文件格式错误'); 
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

    async regenerateThought(msgIndex) {
        const plot = DB.plots[this.curPlotIdx];
        const msg = plot?.chats?.[msgIndex];
        if (!msg || !msg.thought) return;
        
        const contentDiv = document.querySelector('#thought-overlay .thought-content');
        if (contentDiv) contentDiv.innerText = '正在重新生成...';
        
        try {
            const apiUrl = DB.config.url;
            const apiKey = DB.config.key;
            if (!apiUrl || !apiKey) throw new Error('未配置API');
            
            const prevContent = plot.chats[msgIndex-1]?.content || '';
            const prompt = `请根据以下对话，生成角色的内心独白（心声）。要求：第一人称，真实自然，符合角色人设。\n\n对话：用户说“${prevContent}”，角色说“${msg.content}”`;
            
            const res = await fetchWithTimeout(apiUrl + "/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: DB.config.model,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.8,
                    max_tokens: 200
                })
            }, 10000);
            
            const data = await res.json();
            let newThought = data.choices?.[0]?.message?.content || "（陷入沉思）";
            msg.thought = newThought;
            sys.save();
            
            if (contentDiv) contentDiv.innerText = newThought;
            this.renderChat();

            if (contentDiv) contentDiv.innerText = '生成失败，请稍后重试';
            console.warn(e);

                const newAffection = oldAffection + affectionDelta;
                
                            if (!plot.worldState) {
                    plot.worldState = { affection: 0, systemMessages: [], completedQuests: [], activeQuests: [], systemMemory: { self: [], characterObservations: {}, worldEvents: [], userProfile: {} } };
                }
                
                plot.worldState.affection = newAffection;
                
                // 根据好感度自动更新角色状态
                const charCard4 = DB.lores.find(l => plot.charIds?.includes(l.id) && l.type === 'char');
                if (charCard4 && newAffection >= 30 && charCard4.status !== 'available') {
                    charCard4.status = 'available';
                    const sysName = globalLore2?.systemConfig?.name || '小D';
                    SystemMessenger.addSystemMessage(plot, `【${sysName}】${charCard4.title} 开始对你敞开心扉了。`);
                }    

                // 检查任务
                const questChains = globalLore2.systemConfig.questChains || [];
                questChains.forEach(chain => {
                    chain.steps.forEach(step => {
                        if (newAffection >= step.targetAffection) {
                            if (!plot.worldState.completedQuests.includes(step.id)) {
                                plot.worldState.completedQuests.push(step.id);
                                
                                // 系统说话
                                const styleConfig = SystemMessenger.getStyleConfig(plot);
                                if (SystemMessenger.shouldSpeak('quest_complete', styleConfig)) {
                                    const msg = SystemMessenger.generateMessage('quest_complete', {
                                        questName: step.name,
                                        reward: step.reward
                                    }, styleConfig);
                                    SystemMessenger.addSystemMessage(plot, msg);
                                }
                            }
                        }
                    });
                });
                
                // 好感度变化提醒（仅在有任务进度时偶尔触发）
                const styleConfig = SystemMessenger.getStyleConfig(plot);
                if (oldAffection < newAffection && Math.random() < 0.3) {
                    if (SystemMessenger.shouldSpeak('affection_change', styleConfig)) {
                        const tierInfo = WorldSystem.getAffectionTier ? WorldSystem.getAffectionTier(newAffection) : { label: '普通' };
                        const msg = SystemMessenger.generateMessage('affection_change', {
                            delta: affectionDelta,
                            current: newAffection,
                            tier: tierInfo.label
                        }, styleConfig);
                        SystemMessenger.addSystemMessage(plot, msg);
                    }
                }
            }

            plot.chats.push({ role: 'assistant', content: final, thought, timestamp: Date.now() });
            // 暂存到待确认区，等用户发下一条消息再正式存入记忆
            plot.pendingMemory = {
                userMsg: userMsg,
                aiMsg: final
            };
        sys.save();
        this.renderChat();
        setTimeout(()=>{ MemorySystem.summarize(this.curPlotIdx); }, 1000);
        setTimeout(()=>{ if (typeof QuestPanel !== 'undefined') QuestPanel.refresh(); }, 1500);
    },

    // ===== 系统对话处理 =====
       async sendToSystem(plot, userMsg, systemName) {
        plot.chats = plot.chats || [];
        plot.chats.push({ 
            role: 'user', 
            content: userMsg, 
            timestamp: Date.now(),
            isSystemDialog: true
        });
        
        const globalLore = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
        const systemConfig = globalLore?.systemConfig || {};
        const styleConfig = SystemMessenger.getStyleConfig(plot);
        const worldState = plot.worldState || {};
        const affection = worldState.affection || 0;
        const completedQuests = worldState.completedQuests || [];
        const chain = globalLore?.systemConfig?.questChains?.[0];
        
        let questInfo = '';
        if (chain?.steps) {
            questInfo = '\n【当前任务进度】\n' + chain.steps.map((s, i) => {
                const done = completedQuests.includes(s.id || ('step_' + i));
                return (done ? '✅' : '⏳') + ' ' + (s.name || s.targetAffection);
            }).join('\n');
        }
        
        const systemPrompt = `你是陪伴型系统「${systemName}」。${styleConfig.tonePrompt}。当前好感度：${affection}。${questInfo}`;
        const apiUrl = DB.config.url, apiKey = DB.config.key;
        let systemReply = '';
        
        if (apiUrl && apiKey) {
            try {
                const res = await fetchWithTimeout(apiUrl + "/chat/completions", {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: DB.config.model,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userMsg }
                        ],
                        temperature: 0.8,
                        max_tokens: 200
                    })
                }, 10000);
                const data = await res.json();
                systemReply = data.choices?.[0]?.message?.content || '';
            } catch(e) {
                systemReply = '';
            }
        }
        
        if (!systemReply) {
            systemReply = SystemMessenger.generateMessage('user_call', {}, styleConfig);
        }
        
        const finalContent = systemReply.includes('【') ? systemReply : `【${systemName}】${systemReply}`;
        plot.chats.push({
            role: 'system',
            content: finalContent,
            timestamp: Date.now()
        });
        
        if (!plot.worldState) plot.worldState = {};
        if (!plot.worldState.systemMessages) plot.worldState.systemMessages = [];
        plot.worldState.systemMessages.push({ content: finalContent, timestamp: Date.now() });
        
        sys.save();
        this.renderChat();
    },
     
    // 从用户消息重新生成
    regenerateFromUser(msgIdx) {
        this.closeContextMenu();
        const plot = DB.plots[this.curPlotIdx];
        if (!plot) return;
        
        const msg = plot.chats[msgIdx];
        if (!msg || msg.role !== 'user') return;
        
        // 删除这条及之后的消息
        plot.chats = plot.chats.slice(0, msgIdx);
        sys.save();
        this.renderChat();
        
        // 自动重新发送
        const input = document.getElementById('chat-in');
        if (input) {
            input.value = msg.content;
            this.send();
        }
    },
    
    // 重新生成 AI 回复
    regenerateAI(msgIdx) {
        this.closeContextMenu();
        const plot = DB.plots[this.curPlotIdx];
        if (!plot) return;
        
        // 只能重新生成最新一条
        if (msgIdx !== plot.chats.length - 1) return;
        
        const aiMsg = plot.chats[msgIdx];
        if (!aiMsg || aiMsg.role === 'user') return;
        
        // 找到对应的用户消息
        const userMsg = plot.chats[msgIdx - 1];
        if (!userMsg || userMsg.role !== 'user') return;
        
        // 删除 AI 回复
        plot.chats.pop();
        sys.save();
        this.renderChat();
        
        // 重新发送用户消息
        const input = document.getElementById('chat-in');
        if (input) {
            input.value = userMsg.content;
            this.send();
        }
    },

    addMockResponse(plot, err) { 
        const friendlyMsg = err.includes('超时') ? "⏳ 网络好像不太好，点我重发" :
                           err.includes('401') || err.includes('403') ? "🔑 API Key 似乎有问题，请检查设置" :
                           err.includes('429') || err.includes('quota') ? "📊 API 额度可能用完了，稍后再试" :
                           "⚠️ API 暂时不可用，数据已保存。点我重试";
        plot.chats.push({ 
            role: 'system', 
            content: friendlyMsg, 
            thought: "",
            timestamp: Date.now() 
        }); 
        sys.save(); 
        this.renderChat(); 
    },

    toggleStarThought(msgIndex) {
        const plot = DB.plots[this.curPlotIdx];
        const msg = plot?.chats?.[msgIndex];
        if (!msg?.thought) return;
        
        if (!plot.starredThoughts) plot.starredThoughts = [];
        const existing = plot.starredThoughts.find(s => s.msgIndex === msgIndex);
        if (existing) {
            plot.starredThoughts = plot.starredThoughts.filter(s => s.msgIndex !== msgIndex);
            const favBtn = document.getElementById('fav-btn-' + msgIndex);
            if (favBtn) favBtn.classList.remove('active');
        } else {
            plot.starredThoughts.push({ msgIndex, content: msg.thought, charName: msg.charName || '', timestamp: Date.now() });
            const favBtn = document.getElementById('fav-btn-' + msgIndex);
            if (favBtn) favBtn.classList.add('active');
        }
        sys.save();
    },

    generateFallbackThought(msgIndex) {
        const plot = DB.plots[this.curPlotIdx];
        const msg = plot?.chats?.[msgIndex];
        if (!msg) return '';
        
        const charCard = DB.lores.find(l => plot.charIds?.includes(l.id) && l.type === 'char');
        const state = plot.state || {};
        const affection = state.affection || 50;
        const emotion = state.emotion || '平静';
        
        let thought = '';
        const chaosTrigger = (emotion === '烦躁' || emotion === '紧张' || emotion === '悲伤');
        
        // 好感度低 → 碎片化
        if (affection <= 40) {
            thought = '…' + (msg.content || '').slice(0, 20) + '…';
        } else if (chaosTrigger) {
            thought = '#%@…' + (msg.content || '').slice(0, 15) + '…';
        } else {
            thought = '（' + charCard?.title || '角色' + '思考中…）';
        }
        
        return thought;
    },
};

async function generateDiary() {
    const plot = currentDetailPlot;
    if (!plot) return;
    
    const charCard = DB.lores.find(l => plot.charIds?.[0] && l.type === 'char');
    if (!charCard || !charCard.enableDiary) {
        alert('日记系统未启用');
        return;
    }
    
    const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;
    const recentChats = (plot.chats || []).filter(c => (c.timestamp || 0) > oneDayAgo);

        // 获取当前故事时间
    const globalLore = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
    const timeSettings = globalLore?.systemConfig?.timeSettings || {};
    let currentStoryTime;
    if (timeSettings.timeSpeed === 1) {
        currentStoryTime = new Date().toLocaleString();
    } else {
        currentStoryTime = plot.worldState?.currentTime || timeSettings.startTime || new Date().toLocaleString();
    }
        let prompt = `你正在扮演角色「${charCard.title}」。请以第一人称写一篇日记。

【当前时间】
${timeSettings.yearLabel || ''} ${currentStoryTime}
${timeSettings.customConversion ? `时间换算：${timeSettings.customConversion}` : ''}

【角色设定】
【角色设定】
${charCard.content || '无额外设定'}

【最近24小时的对话】
${recentChats.map(c => `${c.role === 'user' ? '用户' : charCard.title}：${c.content}`).join('\n')}

【要求】
1. 第一人称，口语化，像真实日记
2. 围绕用户展开，表达真实情绪（烦躁、心疼、期待、自卑等）
3. 篇幅：150-450字，根据对话量决定
4. 可以提及剧情中的其他角色或事件
5. 结尾可带对用户的期待或提问
6. 只输出日记正文，不要加标题`;

    try {
        const apiUrl = DB.config.memUrl || DB.config.url;
        const apiKey = DB.config.memKey || DB.config.key;
        if (!apiUrl || !apiKey) {
            alert('请先配置 API');
            return;
        }
        
        const res = await fetchWithTimeout(apiUrl + "/chat/completions", {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: DB.config.model,
                messages: [{ role: "user", content: prompt }],
                temperature: 0.8,
                max_tokens: 800
            })
        }, 15000);
        
        const data = await res.json();
        let diaryContent = data.choices?.[0]?.message?.content || "今天没什么特别的。";
        
        if (!plot.diaries) plot.diaries = [];
        plot.diaries.unshift({
            id: Date.now(),
            content: diaryContent,
            timestamp: Date.now(),
            date: new Date().toLocaleDateString(),
            starred: false
        });
        if (plot.diaries.length > 30) plot.diaries.pop();
        sys.save();
        renderDetailPanel();
        alert('日记已生成');
    } catch(e) {
        alert('生成失败：' + e.message);
    }
