function renderSystemMemory(container, globalLore, plot) {
    const ws = plot?.worldState || {};
    const sm = ws.systemMemory || {};
    const sysName = globalLore.systemConfig?.name || '系统';
    const search = document.getElementById('memory-search')?.value.toLowerCase() || '';
    let items = [];
    
    if (currentMemoryType === 'all' || currentMemoryType === 'core') {
        items.push(...(sm.self || []).map(m => ({...m, type:'core', cat:'自我'})));
        items.push(...(sm.worldEvents || []).map(m => ({...m, type:'core', cat:'事件'})));
    }
    if (currentMemoryType === 'all' || currentMemoryType === 'episodic') {
        Object.entries(sm.characterObservations || {}).forEach(([cid, obs]) => {
            const cc = DB.lores.find(l => l.id === cid);
            obs.forEach(o => items.push({...o, type:'episodic', cat:'观察:'+(cc?.title||cid)}));
        });
    }
    if (currentMemoryType === 'all' || currentMemoryType === 'raw') {
        items.push(...(ws.systemMessages || []).map(m => ({
            content: m.content || (m.prefix||'')+' '+(m.content||''),
            timestamp: m.timestamp, type:'raw', cat:'消息'
        })));
    }
    if (search) items = items.filter(i => (i.content||'').toLowerCase().includes(search));
    items.sort((a,b) => (b.timestamp||0)-(a.timestamp||0));
    
    if (!items.length) {
        container.innerHTML = '<div class="memory-card" style="text-align:center;">暂无系统记忆</div>';
        return;
    }
    container.innerHTML = `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">🧠 ${escapeHtml(sysName)}</div>` +
    items.map(i => `<div class="memory-card"><div>${i.type==='core'?'📌':(i.type==='raw'?'💬':'📋')} ${escapeHtml(i.content)}</div><div class="memory-footer"><span class="tag">${i.cat}</span>${i.timestamp?`<span>${new Date(i.timestamp).toLocaleString()}</span>`:''}</div></div>`).join('');
}

            r.onload = ev => { 
                try { 
                    const d = JSON.parse(ev.target.result); 
                    if(d.config) DB.config = { ...DB.config, ...d.config }; 
                    if(d.masks) DB.masks = d.masks;

// ==================== 数据结构兼容升级 ====================
function upgradeDataStructure() {
    // 1. 大世界设定升级
    DB.lores.forEach(lore => {
        if (lore.type === 'global' && !lore.systemConfig) {
            lore.systemConfig = {
                enabled: true,
                name: "小D",
                callCommand: "@小D",
                visibility: "hidden",
                stylePreset: "humorous",
                customTone: "",
                customExample: "",
                talkFrequency: 3,
                questChains: []
            };
        }
    });
    
    // 2. 剧情存档升级
    DB.plots.forEach(plot => {
        // 2.1 如果没有 worldState，创建默认结构
        if (!plot.worldState) {
            plot.worldState = {
                affection: 0,
                systemMessages: [],
                completedQuests: [],
                activeQuests: [],
                systemMemory: {
                    self: [],
                    characterObservations: {},
                    worldEvents: [],
                    userProfile: {}
                }
            };
        }
        
        // 2.2 如果有 worldState 但缺少 systemMemory（向后兼容旧版 worldState）
        if (!plot.worldState.systemMemory) {
            plot.worldState.systemMemory = {
                self: [],
                characterObservations: {},
                worldEvents: [],
                userProfile: {}
            };
        }
        
        // 2.3 如果缺少 completedQuests（向后兼容）
        if (!plot.worldState.completedQuests) {
            plot.worldState.completedQuests = [];
        }
        
        // 2.4 如果缺少 activeQuests（向后兼容）
        if (!plot.worldState.activeQuests) {
            plot.worldState.activeQuests = [];
        }
    });
    
    // 3. 保存升级后的数据
    sys.save();
}

const QuestPanel = {
    isOpen: false,
    
    toggle() {
        this.isOpen ? this.close() : this.open();
    },
    
    open() {
        const panel = document.getElementById('quest-panel');
        if (panel) {
            panel.style.display = 'flex';
            this.isOpen = true;
            this.render();
        }
    },
    
    close() {
        const panel = document.getElementById('quest-panel');
        if (panel) {
            panel.style.display = 'none';
            this.isOpen = false;
        }
    },
    
    getChain() {
        const plot = DB.plots[engine?.curPlotIdx];
        if (!plot) return null;
        const globalLore = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
        if (!globalLore?.systemConfig?.questChains?.length) return null;
        return globalLore.systemConfig.questChains[0]; // 默认取第一个任务链
    },
    
    render() {
        const container = document.getElementById('quest-list');
        if (!container) return;
        
        const chain = this.getChain();
        if (!chain?.steps?.length) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding:40px 0;">暂无任务<br><small>请在大世界设定中配置任务链</small></div>';
            return;
        }
        
        const plot = DB.plots[engine?.curPlotIdx];
        const worldState = plot?.worldState || {};
        const completed = worldState.completedQuests || [];
        const currentAffection = worldState.affection || 0;
        
        container.innerHTML = `
            <div style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">📌 ${chain.name || '主线任务'}</div>
            ${chain.steps.map((step, i) => {
                const isCompleted = completed.includes(step.id || `step_${i}`);
                const isUnlocked = i === 0 || completed.includes(chain.steps[i-1]?.id || `step_${i-1}`);
                const progress = Math.min(100, Math.round((currentAffection / step.targetAffection) * 100));
                
                let statusIcon = '🔒';
                let statusClass = '';
                let progressBar = '';
                
                if (isCompleted) {
                    statusIcon = '✅';
                    statusClass = 'color: var(--green);';
                    progressBar = '<div style="width:100%; height:4px; background:var(--green); border-radius:2px; margin-top:8px;"></div>';
                } else if (isUnlocked) {
                    statusIcon = '⏳';
                    statusClass = 'color: var(--accent);';
                    progressBar = `
                        <div style="width:100%; height:4px; background:var(--border); border-radius:2px; margin-top:8px;">
                            <div style="width:${progress}%; height:100%; background:var(--accent); border-radius:2px;"></div>
                        </div>
                        <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;">${currentAffection}/${step.targetAffection}</div>
                    `;
                }
                
                return `
                    <div style="padding:12px; margin-bottom:8px; background:var(--hover-bg); border-radius:12px; ${isUnlocked ? '' : 'opacity:0.5;'}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:16px;">${statusIcon}</span>
                            <div style="flex:1;">
                                <div style="font-size:13px; font-weight:500; ${statusClass}">${step.name || `目标好感度 ${step.targetAffection}`}</div>
                                <div style="font-size:11px; color:var(--text-secondary);">${step.reward || ''}</div>
                            </div>
                        </div>
                        ${progressBar}
                    </div>
                `;
            }).join('')}
        `;
        
        // 更新红点
        this.updateBadge();
    },
    
    updateBadge() {
        const badge = document.getElementById('quest-badge');
        if (!badge) return;
        
        const plot = DB.plots[engine?.curPlotIdx];
        const worldState = plot?.worldState || {};
        const completed = worldState.completedQuests || [];
        const chain = this.getChain();
        
        if (!chain?.steps) {
            badge.style.display = 'none';
            return;
        }
        
        // 检查是否有刚解锁但未完成的任务
        const hasNewUnlocked = chain.steps.some((step, i) => {
            const prevCompleted = i === 0 || completed.includes(chain.steps[i-1]?.id || `step_${i-1}`);
            const thisCompleted = completed.includes(step.id || `step_${i}`);
            return prevCompleted && !thisCompleted;
        });
        
        badge.style.display = hasNewUnlocked ? 'block' : 'none';
    },
    
    refresh() {
        const plot = DB.plots[engine?.curPlotIdx];
        if (!plot) return;
        
        // 校验任务进度
        const chain = this.getChain();
        if (!chain?.steps) return;
        
        const worldState = plot.worldState || {};
        const currentAffection = worldState.affection || 0;
        let completed = worldState.completedQuests || [];
        let hasChanges = false;
        
        chain.steps.forEach((step, i) => {
            const stepId = step.id || `step_${i}`;
            // 检查是否应该完成
            const prevCompleted = i === 0 || completed.includes(chain.steps[i-1]?.id || `step_${i-1}`);
            if (prevCompleted && currentAffection >= step.targetAffection && !completed.includes(stepId)) {
                completed.push(stepId);
                hasChanges = true;
            }
        });
        
        if (hasChanges) {
            plot.worldState = plot.worldState || {};
            plot.worldState.completedQuests = completed;
            sys.save();
        }
        
        this.render();
    }
};

function addQuestStep() {
    const order = tempQuestSteps.length + 1;
    tempQuestSteps.push({
        order: order,
        id: 'q' + Date.now(),
        name: '',
        targetAffection: (order - 1) * 20 + 5,
        reward: ''
    });
    renderQuestSteps();

function removeQuestStep(index) {
    tempQuestSteps.splice(index, 1);

    tempQuestSteps.forEach((step, i) => {

    renderQuestSteps();

}

async function fetchModels(type) {
    const url = document.getElementById('api-url-edit').value;
    const key = document.getElementById('api-key-edit').value;
    const select = document.getElementById('api-model-edit');
    const status = document.getElementById('model-status');
    
    if (!url || !key) {
        if (status) status.innerText = '⚠️ 请先填写 API URL 和 Key';
        return;
    }
    
    if (status) status.innerText = '⏳ 正在拉取...';
    
    try {
        const res = await fetch(url + '/models', {
            headers: { 'Authorization': `Bearer ${key}` }
        });
        const data = await res.json();
        
        // 兼容不同 API 返回格式
        let models = [];
        if (data.data && Array.isArray(data.data)) {
            // OpenAI 格式
            models = data.data.map(m => m.id);
        } else if (data.models && Array.isArray(data.models)) {
            // 某些代理格式
            models = data.models.map(m => m.id || m.name || m.model);
        } else if (Array.isArray(data)) {
            models = data.map(m => m.id || m.name || m.model);
        }
        
        // 过滤掉非对话模型
        models = models.filter(m => m && !m.includes('embedding') && !m.includes('moderation') && !m.includes('dall-e') && !m.includes('whisper') && !m.includes('tts'));
        
        // 按 chat 优先排序
        models.sort((a, b) => {
            if (a.includes('chat') && !b.includes('chat')) return -1;
            if (!a.includes('chat') && b.includes('chat')) return 1;
            return a.localeCompare(b);
        });
        
        if (models.length === 0) {
            if (status) status.innerText = '⚠️ 未找到可用模型，请手动输入';
            return;
        }
        
        // 填充下拉框
        const currentModel = type === 'main' ? DB.config.model : (DB.config.model || '');
        select.innerHTML = models.map(m => 
            `<option value="${m}" ${m === currentModel ? 'selected' : ''}>${m}</option>`
        ).join('');
        
        if (status) status.innerText = `✅ 找到 ${models.length} 个模型`;
    } catch(e) {
        if (status) status.innerText = '❌ 拉取失败，请检查 URL 和 Key';
    }
}

async function analyzeAffectionChange(userMsg, aiReply) {
    const plot = DB.plots[engine.curPlotIdx];
    const charCard = DB.lores.find(l => plot?.charIds?.includes(l.id) && l.type === 'char');
    const url = DB.config.url, key = DB.config.key;
    if (!url || !key) return Math.floor(Math.random() * 3) + 1;

    const prompt = `分析以下对话，判断用户的行为对角色好感度的影响。返回JSON：{"delta":整数(-5到5), "reason":"简短原因(10字内)"}

角色：${charCard?.title || '未知'}
用户：${userMsg}
角色回复：${aiReply}

规则：
- 友善/关心/幽默/认同 → +1到+3
- 冷漠/敷衍/冒犯 → -1到-3
- 重大帮助/表白/深度共鸣 → +4到+5
- 严重冲突/背叛 → -4到-5
- 普通对话 → 0`;

    try {
        const res = await fetchWithTimeout(url + "/chat/completions", {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: DB.config.model, messages: [{ role: "user", content: prompt }], temperature: 0.3, max_tokens: 60 })
        }, 8000);
        const data = await res.json();
        const aiMsg = data.choices?.[0]?.message?.content || '';
        const match = aiMsg.match(/\{[\s\S]*\}/);
        if (match) {
            const parsed = JSON.parse(match[0]);
            return parsed.delta || 0;
        }
    } catch(e) {}
    return 0;
}

async function autoPlotSummary(plot, userMsg, aiReply) {
    const url = DB.config.url, key = DB.config.key;
    if (!url || !key) return;
    
    const nodeCount = (plot.worldState?.plotNodes || []).length;
    // 每5轮对话才尝试总结一次，节省 token
    if (nodeCount > 0 && (plot.chats?.length || 0) % 5 !== 0) return;
    
    const charCard = DB.lores.find(l => plot.charIds?.includes(l.id) && l.type === 'char');
    const lastNodes = (plot.worldState?.plotNodes || []).slice(-3).map(n => n.title + '：' + n.summary).join('\n');
    
    const prompt = `分析以下对话是否有重要剧情进展。如果有，返回JSON；如果没有，返回null。

已有剧情节点：
${lastNodes || '（暂无）'}

最新对话：
用户：${userMsg}
${charCard?.title || '角色'}：${aiReply}

判断标准：
- 初次见面、关系转折、重要承诺、冲突、秘密揭露 = 有进展
- 普通闲聊、日常问候 = 无进展

如果有进展，返回：{"title":"简短标题(10字内)","summary":"一句话总结(30字内)","importance":1-5}
如果无进展，返回：null`;

    try {
        const res = await fetchWithTimeout(url + "/chat/completions", {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: DB.config.model, messages: [{ role: "user", content: prompt }], temperature: 0.3, max_tokens: 100 })
        }, 8000);
        const data = await res.json();
        const aiMsg = data.choices?.[0]?.message?.content || '';
        if (aiMsg.includes('null') || aiMsg.trim() === '') return;
        
        const match = aiMsg.match(/\{[\s\S]*\}/);
        if (match) {
            const node = JSON.parse(match[0]);
            if (!plot.worldState) plot.worldState = {};
            if (!plot.worldState.plotNodes) plot.worldState.plotNodes = [];
            plot.worldState.plotNodes.push({
                id: 'node_' + Date.now(),
                title: node.title,
                summary: node.summary,
                importance: node.importance || 3,
                time: getStoryTime(),
                createdAt: Date.now()
            });
            if (plot.worldState.plotNodes.length > 30) plot.worldState.plotNodes.shift();
            sys.save();
        }
    } catch(e) {}
}

                <div class="collapse-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="cursor:pointer; padding:12px 0; border-bottom:0.5px solid var(--border);">
                    <span class="collapse-title">🧠 系统设置</span><span class="collapse-icon">▼</span>
                </div>
                <div style="display:block; padding:12px 0;">
                    <label>系统名称</label>
                    <input type="text" id="ws-sys-name" value="${escapeHtml(sysConfig.name || '小D')}">
                    <label>呼叫指令</label>
                    <input type="text" id="ws-sys-call" value="${escapeHtml(sysConfig.callCommand || '@小D')}">
                    <label>系统风格</label>
                    <select id="ws-sys-style">
                        ${Object.entries(SystemStylePresets).map(([key, preset]) => `<option value="${key}" ${sysConfig.stylePreset === key ? 'selected' : ''}>${preset.icon} ${preset.name}</option>`).join('')}
                    </select>
                    <label>话唠程度：<span id="ws-sys-freq-label">${sysConfig.talkFrequency || 3}</span>/10</label>
                    <input type="range" id="ws-sys-freq" min="1" max="10" value="${sysConfig.talkFrequency || 3}" oninput="document.getElementById('ws-sys-freq-label').innerText=this.value" style="width:100%;">
                    
                    <div class="section-title" style="margin-top:12px;">📋 任务链</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">${sysConfig.questChains?.[0]?.steps?.length || 0}个步骤</div>
                    <button class="btn btn-gray" onclick="WorldSettingsPanel.saveSystemConfig(); ui.closeLayer(); setTimeout(()=>{ const l=DB.lores.find(l=>l.id===DB.plots[engine.curPlotIdx]?.globalId&&l.type==='global'); if(l) loreOps.openEdit(l.id); }, 200);" style="width:100%;">管理任务链与高级设置</button>
                    <button class="btn btn-gray" onclick="WorldSettingsPanel.saveSystemConfig()" style="width:100%; margin-top:4px;">保存系统设置</button>
                </div>
                
                <!-- ===== 记忆设置 ===== -->
                <div class="collapse-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="cursor:pointer; padding:12px 0; border-bottom:0.5px solid var(--border);">
                    <span class="collapse-title">🧠 记忆设置</span><span class="collapse-icon">▼</span>
                </div>
                <div style="display:block; padding:12px 0;">
                    <label>自动提取</label>
                    <select id="ws-mem-auto">
                        <option value="1" ${memSettings.autoExtract ? 'selected' : ''}>开启</option>
                        <option value="0" ${!memSettings.autoExtract ? 'selected' : ''}>关闭（手动提取）</option>
                    </select>
                    <label>提取间隔（回合数）</label>
                    <input type="number" id="ws-mem-interval" value="${memSettings.extractInterval || 30}" min="5" max="200">
                    <label>核心记忆阈值</label>
                    <input type="range" id="ws-mem-threshold" min="0.7" max="1.0" step="0.05" value="${memSettings.coreThreshold || 0.9}" style="width:100%;">
                    <div style="font-size:11px; color:var(--text-secondary);">当前：<span id="ws-mem-threshold-label">${Math.round((memSettings.coreThreshold || 0.9) * 100)}%</span></div>
                    <button class="btn btn-gray" onclick="WorldSettingsPanel.saveMemoryConfig()" style="width:100%; margin-top:8px;">保存记忆设置</button>
                    <button class="btn btn-gray" onclick="MemoryEngine.manualExtract(charCard?.id);" style="width:100%; margin-top:4px;">📝 手动提取</button>
                </div>
                
                <!-- ===== 时间设置 ===== -->
                <div class="collapse-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="cursor:pointer; padding:12px 0; border-bottom:0.5px solid var(--border);">
                    <span class="collapse-title">⏱️ 时间设置</span><span class="collapse-icon">▼</span>
                </div>
                <div style="display:block; padding:12px 0;">
                    <div style="font-size:14px; font-weight:600; margin-bottom:8px;">🕐 当前时间：${currentTime}</div>
                    <div style="font-size:11px; color:var(--text-secondary); margin-bottom:8px;">换算：${timeSettings.customConversion || '默认现实时间（1天=24小时，1年=365天）'}</div>
                    
                    <label>小幅推进</label>
                    <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px;">
                        <button class="btn btn-gray" onclick="TimePanel.advance(30)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+30分</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(60)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+1时</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(180)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+3时</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(1440)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+1天</button>
                    </div>
                    
                    <label>大幅跳跃</label>
                    <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px;">
                        <button class="btn btn-gray" onclick="TimePanel.advance(10080)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+7天</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(43200)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+30天</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(129600)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+90天</button>
                        <button class="btn btn-gray" onclick="TimePanel.advance(525600)" style="flex:1; min-width:50px; padding:6px; font-size:11px;">+1年</button>
                    </div>
                    
                    <button class="btn btn-gray" onclick="TimePanel.syncToAI()" style="width:100%; margin-top:4px;">🔄 同步当前时间给 AI</button>
                </div>
            </div>
        `;
        
        ui.openLayer('⚙️ 大世界设置', html, '关闭', () => ui.closeLayer());
        
        // 记忆阈值滑块绑定
        setTimeout(() => {
            const thresholdSlider = document.getElementById('ws-mem-threshold');
            if (thresholdSlider) {
                thresholdSlider.addEventListener('input', function() {
                    const label = document.getElementById('ws-mem-threshold-label');
                    if (label) label.innerText = Math.round(this.value * 100) + '%';
                });
            }
        }, 100);
    },
    
    saveGlobalContent() {
        const plot = DB.plots[engine.curPlotIdx];
        const globalLore = DB.lores.find(l => l.id === plot?.globalId && l.type === 'global');
        if (globalLore) {
            globalLore.content = document.getElementById('ws-global-content')?.value || '';
            sys.save();
            alert('世界简介已保存');
        }
    },
    
    saveSystemConfig() {
        const plot = DB.plots[engine.curPlotIdx];
        const globalLore = DB.lores.find(l => l.id === plot?.globalId && l.type === 'global');
        if (globalLore) {
            if (!globalLore.systemConfig) globalLore.systemConfig = {};
            globalLore.systemConfig.name = document.getElementById('ws-sys-name')?.value || '小D';
            globalLore.systemConfig.callCommand = document.getElementById('ws-sys-call')?.value || '@小D';
            globalLore.systemConfig.stylePreset = document.getElementById('ws-sys-style')?.value || 'humorous';
            globalLore.systemConfig.talkFrequency = parseInt(document.getElementById('ws-sys-freq')?.value) || 3;
            sys.save();
            alert('系统设置已保存');
        }
    },
    
    saveMemoryConfig() {
        const plot = DB.plots[engine.curPlotIdx];
        const charCard = DB.lores.find(l => plot?.charIds?.[0] && l.type === 'char');
        if (charCard) {
            if (!charCard.memorySettings) charCard.memorySettings = {};
            charCard.memorySettings.autoExtract = document.getElementById('ws-mem-auto')?.value === '1';
            charCard.memorySettings.extractInterval = parseInt(document.getElementById('ws-mem-interval')?.value) || 30;
            charCard.memorySettings.coreThreshold = parseFloat(document.getElementById('ws-mem-threshold')?.value) || 0.9;
            sys.save();
            alert('记忆设置已保存');
        }
    }
};

const WorldDetailPanel = {
    buildHTML() {
        const plot = DB.plots[engine?.curPlotIdx];
        if (!plot) return '请先进入剧情';
        
        const globalLore = DB.lores.find(l => l.id === plot.globalId && l.type === 'global');
        
        const boundLocals = DB.lores.filter(l => l.type === 'local' && (plot.localIds || []).includes(String(l.id)));
        const unboundLocals = DB.lores.filter(l => l.type === 'local' && !(plot.localIds || []).includes(String(l.id)));
        
        // 已绑定的故事线
        const boundStorylines = DB.lores.filter(l => l.type === 'storyline' && l.globalId === plot.globalId);
        // 未绑定的故事线
        const unboundStorylines = DB.lores.filter(l => l.type === 'storyline' && l.globalId !== plot.globalId);
        
        const boundChars = DB.lores.filter(l => plot.charIds?.includes(l.id) && l.type === 'char');
        const unboundChars = DB.lores.filter(l => !plot.charIds?.includes(l.id) && l.type === 'char');
        
        return `
            <div style="padding:8px;">
                <div class="section-title" style="margin-top:0;">🌍 世界简介</div>
                <textarea id="wd-global-content" rows="4" style="width:100%;">${escapeHtml(globalLore?.content || '')}</textarea>
                <button class="btn btn-gray" onclick="WorldDetailPanel.saveGlobalContent()" style="width:100%; margin-top:4px;">保存简介</button>
                
                <div class="section-title" style="margin-top:16px;">📚 局部设定</div>
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">已绑定 (${boundLocals.length}个)</div>
                ${boundLocals.length === 0 ? '<div style="font-size:11px;color:var(--text-secondary); margin-bottom:8px;">暂无</div>' : boundLocals.map(l => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                        <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                        <span style="color:var(--danger); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.unbind('local','${l.id}')">解绑</span>
                    </div>
                `).join('')}
                ${unboundLocals.length > 0 ? `
                    <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; margin-bottom:4px;">可添加 (${unboundLocals.length}个)</div>
                    ${unboundLocals.map(l => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                            <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                            <span style="color:var(--accent); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.bind('local','${l.id}')">添加</span>
                        </div>
                    `).join('')}
                ` : '<div style="font-size:11px;color:var(--text-secondary); margin-top:4px;">所有局部设定已绑定</div>'}
                
                <div class="section-title" style="margin-top:16px;">📖 故事线</div>
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">已绑定 (${boundStorylines.length}个)</div>
                ${boundStorylines.length === 0 ? '<div style="font-size:11px;color:var(--text-secondary); margin-bottom:8px;">暂无</div>' : boundStorylines.map(l => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                        <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                        <span style="color:var(--danger); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.unbind('storyline','${l.id}')">解绑</span>
                    </div>
                `).join('')}
                ${unboundStorylines.length > 0 ? `
                    <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; margin-bottom:4px;">可添加 (${unboundStorylines.length}个)</div>
                    ${unboundStorylines.map(l => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                            <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                            <span style="color:var(--accent); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.bind('storyline','${l.id}')">添加</span>
                        </div>
                    `).join('')}
                ` : '<div style="font-size:11px;color:var(--text-secondary); margin-top:4px;">所有故事线已绑定</div>'}
                
                <div class="section-title" style="margin-top:16px;">👤 角色卡</div>
                <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">已绑定 (${boundChars.length}个)</div>
                ${boundChars.length === 0 ? '<div style="font-size:11px;color:var(--text-secondary); margin-bottom:8px;">暂无</div>' : boundChars.map(l => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                        <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                        <span style="color:var(--danger); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.unbind('char','${l.id}')">解绑</span>
                    </div>
                `).join('')}
                ${unboundChars.length > 0 ? `
                    <div style="font-size:11px; color:var(--text-secondary); margin-top:8px; margin-bottom:4px;">可添加 (${unboundChars.length}个)</div>
                    ${unboundChars.map(l => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--border);">
                            <span style="font-size:12px;">${escapeHtml(l.title)}</span>
                            <span style="color:var(--accent); cursor:pointer; font-size:12px;" onclick="WorldDetailPanel.bind('char','${l.id}')">添加</span>
                        </div>
                    `).join('')}
                ` : '<div style="font-size:11px;color:var(--text-secondary); margin-top:4px;">所有角色卡已绑定</div>'}
            </div>
        `;
    },
    
    open() {
        const html = this.buildHTML();
        ui.openLayer('📋 管理世界设定', html, '关闭', () => ui.closeLayer());
    },
    
    saveGlobalContent() {
        const plot = DB.plots[engine.curPlotIdx];
        const globalLore = DB.lores.find(l => l.id === plot?.globalId && l.type === 'global');
        if (globalLore) {
            globalLore.content = document.getElementById('wd-global-content')?.value || '';
            sys.save();
            alert('世界简介已保存');
        }
    },
    
    bind(type, id) {
        const plot = DB.plots[engine.curPlotIdx];
        if (!plot) return;
        if (type === 'local') {
            if (!plot.localIds) plot.localIds = [];
            if (plot.localIds.includes(id)) { alert('该局部设定已绑定'); return; }
            plot.localIds.push(id);
        } else if (type === 'storyline') {
            const lore = DB.lores.find(l => l.id == id);
            if (lore) {
                if (lore.globalId === plot.globalId) { alert('该故事线已绑定'); return; }
                lore.globalId = plot.globalId;
            }
        } else if (type === 'char') {
            if (!plot.charIds) plot.charIds = [];
            if (plot.charIds.includes(id)) { alert('该角色卡已绑定'); return; }
            plot.charIds.push(id);
        }
        sys.save();
        this.refreshUI();
    },
    
    unbind(type, id) {
        const plot = DB.plots[engine.curPlotIdx];
        if (!plot) return;
        if (!confirm('确定解绑吗？')) return;
        if (type === 'local') {
            plot.localIds = (plot.localIds || []).filter(i => i !== id);
        } else if (type === 'storyline') {
            const lore = DB.lores.find(l => l.id == id);
            if (lore) lore.globalId = null;
        } else if (type === 'char') {
            plot.charIds = (plot.charIds || []).filter(i => i !== id);
        }
        sys.save();
        this.refreshUI();
    },
    
    refreshUI() {
        const content = document.getElementById('layer-body');
        if (content) {
            content.innerHTML = this.buildHTML();
        }
    }
};

console.log("🎉 S&N · 留白 已启动 — Space & Narrative");
</script>
</body>
